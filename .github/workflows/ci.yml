name: Ubuntu CI

on:
  pull_request:
  push:
    branches:
      - 'ign-cmake[0-9]'
      - 'gz-cmake[0-9]'
      - 'main'

jobs:
  resolute-ci:
    runs-on: ubuntu-latest
    name: Ubuntu Resolute CI
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Compile and test
        id: ci
        uses: gazebo-tooling/action-gz-ci@resolute
        with:
          gzdev-project-name: rotary
          cmake-args: '-DBUILDSYSTEM_TESTING=True -DGZ_ENABLE_RELOCATABLE_INSTALL=True'

